# Nginx configuration for Xiehaoyu-Agent
# Place at: /etc/nginx/sites-available/xiehaoyu-agent
# Then: sudo ln -s /etc/nginx/sites-available/xiehaoyu-agent /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name _;  # Replace with your domain, e.g. agent.example.com

    # Frontend static files
    root /srv/xiehaoyu-agent/frontend/dist;
    index index.html;

    # SPA routing: serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy with SSE support
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: disable buffering
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;

        # Increase body size for large requests
        client_max_body_size 10m;
    }
}