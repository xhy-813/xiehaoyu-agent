# Nginx configuration for Xiehaoyu-Agent
# Place at: /etc/nginx/sites-available/xiehaoyu-agent
# Then: sudo ln -s /etc/nginx/sites-available/xiehaoyu-agent /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name _;  # Replace with your domain, e.g. agent.example.com

    # Frontend static files
    root /srv/xiehaoyu-agent/frontend/dist;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # gzip（808 审查 M7：plotly bundle ~3.5MB，文本压缩约 -70%）
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
    gzip_comp_level 5;

    # 带内容 hash 的 Vite 构建产物：长缓存 + immutable（808 审查 M7）
    # 注意：location 内定义 add_header 会覆盖 server 级 add_header，安全头需重复
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA routing: serve index.html for all non-file routes
    # index.html 不长缓存，避免发版后拿不到新 hash（同上的继承坑，重复安全头）
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # API reverse proxy with SSE support
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: disable buffering
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;

        # Chat API only sends JSON text — 1m is more than enough
        client_max_body_size 1m;
    }
}